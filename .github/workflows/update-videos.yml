name: Update Vimeo videos

permissions:
  contents: write

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: videos.json 생성
        env:
          VIMEO_TOKEN: ${{ secrets.VIMEO_TOKEN }}
        run: node .github/scripts/fetch-videos.js
      - name: 변경사항 커밋
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add videos.json
          git diff --staged --quiet || git commit -m "chore: videos.json 자동 갱신"
          git push
